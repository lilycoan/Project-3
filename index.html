<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WearCast</title>
  <meta name="description" content="WearCast suggests what to wear and bring for your day or evening, based on the forecast.">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Status messages (loading, errors, new location) are announced here (R31). -->
  <div id="status" class="visually-hidden" role="status" aria-live="polite"></div>

  <!-- Shown only in test forecast mode (?fixture=), never on the normal URL (R33). -->
  <p id="test-banner" class="test-banner" hidden>Test data, not live weather.</p>

  <h1 class="visually-hidden">WearCast</h1>

  <!-- One set of markup for both layouts: a flex column on phone, a grid at 768 px and up (R29). -->
  <div id="main-screen" class="screen main-screen">
    <!-- App name in the laptop header bar. The h1 above carries the name for screen readers. -->
    <p class="brand" aria-hidden="true">WearCast</p>

    <!-- Always-visible context (R10) -->
    <div class="context">
      <p class="place" id="place">WearCast</p>
      <p class="context-line">
        <span id="date-label"></span>
        <span class="tag" id="time-tag" hidden></span>
        <span class="units">°F · mph</span>
      </p>
      <p class="source">Weather: <a href="https://open-meteo.com/">Open-Meteo</a></p>
    </div>

    <button type="button" class="icon-button info-open" id="info-open" aria-label="About WearCast">
      <img src="assets/icons/lucide/info.svg" alt="">
    </button>

    <main class="content" id="content">
      <!-- The character is the focus of Main (R12). Its text alternative describes the outfit drawn (R31). -->
      <div class="character-card">
        <div class="character" id="character" role="img" aria-label=""></div>
      </div>
      <p class="recommendation" id="recommendation"></p>

      <section class="weather" id="weather" aria-label="Weather for this time window">
        <div class="feels">
          <img class="condition-icon" id="condition-icon" src="" alt="" hidden>
          <div>
            <p class="label">Feels like</p>
            <p class="feels-range" id="feels"></p>
          </div>
        </div>
        <ul class="tiles">
          <li class="tile"><span class="label">Rain</span> <span class="value" id="rain"></span></li>
          <li class="tile"><span class="label">UV</span> <span class="value" id="uv"></span></li>
          <li class="tile"><span class="label">Wind</span> <span class="value" id="wind"></span></li>
        </ul>
      </section>

      <section class="reminders" aria-labelledby="reminders-title">
        <h2 id="reminders-title">Reminders <span class="reminder-count" id="reminder-count" hidden></span></h2>
        <ul class="reminder-list" id="reminder-list"></ul>
      </section>
    </main>

    <!-- Location, date and window controls: a bottom bar in thumb reach on phone (R30),
         spread into the header and week strip on laptop. -->
    <div class="controls">
      <form class="search" id="search-form" role="search">
        <label for="place-input" class="visually-hidden">City or ZIP</label>
        <input id="place-input" type="search" placeholder="City or ZIP" autocomplete="off" enterkeyhint="search">
        <button type="button" class="icon-button locate-button" id="locate-button">
          <img src="assets/icons/lucide/locate.svg" alt="">
          <span class="locate-label">Use my location</span>
        </button>
      </form>
      <div class="day-strip" id="day-strip" role="group" aria-label="Date"></div>
      <div class="window-toggle" role="group" aria-label="Time of day">
        <button type="button" data-window="day" aria-pressed="true">Day</button>
        <button type="button" data-window="evening" aria-pressed="false">Evening</button>
      </div>
    </div>
  </div>

  <section id="info-screen" class="screen info-screen" aria-labelledby="info-title" hidden>
    <button type="button" class="back-button" id="info-close">
      <img src="assets/icons/lucide/arrow-left.svg" alt=""> Back
    </button>
    <h2 id="info-title">About this app</h2>
    <p>Creator, data sources, how recommendations work, privacy and credits are added in CP11.</p>
  </section>
</body>
</html>
